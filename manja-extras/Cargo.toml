[package]
name = "manja-extras"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Optional extras for the manja SDK (e.g. WebDriver login)"
repository = "https://github.com/saxena-dev/manja"

[dependencies]
base32 = "0.5.0"
fantoccini = "0.19.3"
manja-core = { path = "../manja-core" }
secrecy = "0.8.0"
serde_json = "1.0.117"
thiserror = "1.0.61"
tokio = { version = "1.37.0", features = ["full"] }
totp-rs = "5.5.1"
url = "2.5.0"
