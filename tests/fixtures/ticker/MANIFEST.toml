# Provenance manifest for the vendored binary ticker corpus (docs/verification.md §1.2).
#
# Every file under tests/fixtures/ticker/ except this manifest has exactly one
# [[file]] entry, and tests/fixture_manifest.rs re-hashes each one and rejects any
# unlisted file. The manifest itself is outside its own covered set.
#
# Classes: "captured" = bytes recorded from a live Kite WebSocket session;
# "derived" = bytes cut or re-framed from captured bytes, or generated from them;
# "synthetic" = hand-constructed bytes with no capture origin.
#
# The <case>.json files are expectation outputs of the qdx decoder in the source
# repository. They are a cross-implementation ORACLE, not protocol truth: the
# protocol reference is kite:websocket.md (docs/kite-sources.toml), and any
# disagreement is dispositioned in writing, never normalized away.
#
# tick_set_0__2026_01_21.bin is a TEST-ONLY capture container, not a manja
# format: a sequence of records, each a little-endian u64 receipt time in Unix
# nanoseconds, a little-endian u32 payload length, then that many bytes of the
# unchanged big-endian Kite binary message.
# The reader lives in tests/support/capture.rs and is never exported by manja.

