# Provenance manifest for the vendored binary ticker corpus (docs/verification.md §1.2).
#
# Every file under tests/fixtures/ticker/ except this manifest has exactly one
# [[file]] entry, and tests/fixture_manifest.rs re-hashes each one and rejects any
# unlisted file. The manifest itself is outside its own covered set.
#
# No file here holds bytes recorded from a Kite session. Classes:
# "synthetic" = hand-constructed bytes, and the decoded expectation of such bytes;
# "synthetic-derived" = bytes produced by a constraint-preserving perturbation of a
# private capture (docs/verification.md §1.2): the same framing, counts, lengths,
# packet families, instrument tokens, zero masks and signs, with every other non-zero
# value different from the original. Such an entry records the tool and its version,
# the parameter set (a summary) and parameter_set_sha256 (the SHA-256 of the tool's
# complete parameter file), the seed, and the SHA-256 and size of the private original,
# which never leaves private storage. For the three protocol fixtures cut from the
# corpus and their oracles, original_sha256 and original_size identify the capture they
# were cut from.
#
# The <case>.json files are expectation outputs of an independent decoder
# implementation, not manja's. They are a cross-implementation ORACLE, not protocol
# truth: the protocol reference is kite:websocket.md (docs/kite-sources.toml), and any
# disagreement is dispositioned in writing, never normalized away.
#
# synthetic_corpus.bin is a TEST-ONLY capture container, not a manja format: a sequence
# of records, each a little-endian u64 receipt time in Unix nanoseconds, a little-endian
# u32 payload length, then that many bytes of a big-endian Kite binary message.
# The reader lives in tests/support/capture.rs and is never exported by manja.

manifest_version = 1

