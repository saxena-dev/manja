# CI for the feature slices (docs/contract.md §1, docs/verification.md §6).
#
# Every feature row is tested on the declared MSRV (1.88.0) and on the stable
# channel. Dependencies are fetched from crates.io because Cargo.lock is not
# tracked; the resolver picks versions that support the declared MSRV, on
# both rows. The pinned kiteconnect-mocks submodule
# is materialized before any test runs; a missing fixture fails setup rather
# than letting fixture-backed tests be skipped. Fixtures are test-only and are
# not part of the packaged crate.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test ${{ matrix.toolchain }} ${{ matrix.row }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.88.0", "stable"]
        row:
          - no-default
          - decoder
          - http
          - ticker
          - ticker,decoder
          - http,ticker
          - http,ticker,decoder
          - default
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Verify the pinned fixtures
        run: |
          set -euo pipefail
          revision=$(git -C kiteconnect-mocks rev-parse HEAD)
          expected=$(git ls-tree HEAD kiteconnect-mocks | awk '{print $3}')
          echo "kiteconnect-mocks at $revision (pinned $expected)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$revision" = "$expected"
          for f in profile.json postback.json ticker_full.packet; do
            test -s "kiteconnect-mocks/$f" || { echo "missing fixture $f"; exit 1; }
          done
          test -s tests/fixtures/ticker/MANIFEST.toml
      - name: Install Rust ${{ matrix.toolchain }}
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
          rustup default ${{ matrix.toolchain }}
          rustc --version | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Feature arguments
        id: args
        run: |
          case "${{ matrix.row }}" in
            default) echo "args=" >> "$GITHUB_OUTPUT" ;;
            no-default) echo "args=--no-default-features" >> "$GITHUB_OUTPUT" ;;
            *) echo "args=--no-default-features --features ${{ matrix.row }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: cargo test
        run: cargo test ${{ steps.args.outputs.args }}
      - name: Resolved normal graph
        run: |
          set -euo pipefail
          cargo tree ${{ steps.args.outputs.args }} -e normal --prefix none | sort -u > tree.txt
          has() { grep -q "^$1 v" tree.txt; }
          case "${{ matrix.row }}" in
            no-default|decoder)
              ! has tokio && ! has reqwest && ! has hyper && ! has tungstenite ;;
            http)
              ! has tungstenite && ! has tokio-tungstenite ;;
            ticker|ticker,decoder)
              ! has reqwest && ! has hyper ;;
          esac
          ! has tracing-subscriber
          ! has fantoccini
          ! has totp-rs

  lint:
    name: fmt, clippy and doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version | tee -a "$GITHUB_STEP_SUMMARY"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  # Coverage of the all-features test run, uploaded to Codecov for the README
  # badge. Upload needs the CODECOV_TOKEN repository secret; a failed upload
  # does not fail the build.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable
          rustc --version | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --all-features --lcov --output-path lcov.info
      - name: Coverage summary
        run: |
          {
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
