# Kite Connect v3 documentation pages cited by this repository.
#
# A citation in source, tests or docs has the form `kite:<page>.md:<lines>`,
# for example `kite:orders.md:42-52`, or `kite:<page>.md` for a whole page.
# <page> is a [[page]] entry below. <lines> are 1-based line numbers, as
# comma-separated numbers or ranges, in the exact bytes that were fetched
# from `url` at `accessed`. `sha256` and `bytes` identify those bytes, and
# `lines` is their newline count.
#
# The pages are Markdown served by Kite Connect: append `index.md` to a page
# path of https://kite.trade/docs/connect/v3/. `scripts/verify-kite-sources.sh`
# fetches every page again and reports any page whose content has changed
# since it was accessed. `tests/references.rs` checks, without a network,
# that every citation names a page listed here and stays within its lines.

