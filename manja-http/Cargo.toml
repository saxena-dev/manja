[package]
name = "manja-http"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "HTTP client crate for the manja SDK"
repository = "https://github.com/saxena-dev/manja"

[dependencies]
backoff = { version = "0.4.0", features = ["tokio"], optional = true }
chrono = { version = "0.4.38", features = ["serde"] }
reqwest = { version = "0.12.4", features = ["json", "gzip", "zstd"] }
secrecy = "0.8.0"
serde = { version = "1.0.202", features = ["derive"] }
serde_json = "1.0.117"
sha2 = "0.10.8"
thiserror = "1.0.61"
tokio = { version = "1.37.0", features = ["full"] }
tracing = "0.1.40"
csv = "1.3.0"
manja-core = { path = "../manja-core" }

[features]
default = ["backoff"]
backoff = ["dep:backoff"]
