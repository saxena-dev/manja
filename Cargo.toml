[package]
name = "manja"
version = "0.2.0"
edition = "2021"
authors = ["Paresh Saxena <pareshsaxena@gmail.com>"]
license = "MIT"
description = "Asynchronous client library for Zerodha's Kite Connect trading API"
repository = "https://github.com/saxena-dev/manja"
readme = "README.md"
documentation = "https://docs.rs/manja"
exclude = [
    "Cargo.lock",
    "tests/*",
    "examples/*",
    "*.md",
    ".*",
    ".temp/*",
    "kiteconnect-mocks",
    "*.py"
]

[dependencies]
base32 = { version = "0.5.0", optional = true }
chrono = { version = "0.4.38", features = ["serde"] }
csv = { version = "1.3.0", optional = true }
dotenv = "0.15.0"
fantoccini = "0.19.3"
futures-util = { version = "0.3.30", optional = true }
hex = { version = "0.4.3", optional = true }
reqwest = { version = "0.12.4", features = ["json", "gzip", "zstd"] }
secrecy = "0.8.0"
serde = "1.0.202"
serde_json = "1.0.117"
sha2 = { version = "0.10.8", optional = true }
stubborn-io = { version = "0.3.5", optional = true }
thiserror = "1.0.61"
tokio = { version = "1.37.0", features = ["full"], optional = true }
tokio-tungstenite = { version = "0.23.1", features = ["native-tls"], optional = true }
totp-rs = { version = "5.5.1", optional = true }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
tungstenite = { version = "0.23.0", optional = true }
url = { version = "2.5.0", optional = true }

# Feature slices (plans/sdk-contract.v0.md §8). The migration-period default
# enables every slice, so existing HTTP, login and legacy ticker paths stay
# available. `login` is compiled with `http` only until S26 removes it.
[features]
default = ["http", "ticker", "decoder"]
http = ["dep:csv", "dep:hex", "dep:sha2", "dep:tokio", "dep:totp-rs", "dep:base32", "dep:url"]
ticker = ["dep:futures-util", "dep:stubborn-io", "dep:tokio", "dep:tokio-tungstenite", "dep:tungstenite"]
decoder = []

[dev-dependencies]
# Re-hashes the vendored ticker corpus in tests/fixture_manifest.rs.
sha2 = "0.10.8"
# Paused-clock tests of admission windows and deadlines.
tokio = { version = "1.37.0", features = ["full", "test-util"] }

# Integration tests that need a live-transport slice declare it, so every
# feature row can run `cargo test` over the targets it supports.
[[test]]
name = "support"
path = "tests/support/main.rs"
required-features = ["http", "ticker"]

[[test]]
name = "http_classification"
required-features = ["http"]

[[test]]
name = "http_admission"
required-features = ["http"]

[[test]]
name = "http_scheduling"
required-features = ["http"]

[[test]]
name = "http_reads"
required-features = ["http"]

[[test]]
name = "http_orders"
required-features = ["http"]

[[test]]
name = "http_margins"
required-features = ["http"]

[[test]]
name = "http_market"
required-features = ["http"]

[[test]]
name = "http_session"
required-features = ["http"]

[[test]]
name = "http_observability"
required-features = ["http"]
