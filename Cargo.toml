[package]
name = "manja"
version = "0.3.0"
edition = "2021"
authors = ["Paresh Saxena <pareshsaxena@gmail.com>"]
license = "MIT"
description = "Asynchronous client library for Zerodha's Kite Connect trading API"
repository = "https://github.com/saxena-dev/manja"
readme = "README.md"
documentation = "https://docs.rs/manja"
exclude = [
    # See .gitignore for development-only artifacts; this list focuses on
    # large or non-source assets that should not be packaged on crates.io.
    "Cargo.lock",
    ".gitignore",
    ".github/*",
    ".temp/*",
    ".codex/*",
    ".agent/*",
    ".data/*",
    "data/*",
    "kiteconnect-mocks/*",
]

[dependencies]
backoff = { version = "0.4.0", features = ["tokio"], optional = true }
base32 = { version = "0.5.0", optional = true }
chrono = { version = "0.4.38", features = ["serde"] }
csv = "1.3.0"
dotenv = { version = "0.15.0", optional = true }
fantoccini = { version = "0.19.3", optional = true }
futures-util = "0.3.30"
hex = "0.4.3"
reqwest = { version = "0.12.4", features = ["json", "gzip", "zstd"] }
secrecy = "0.8.0"
serde = { version = "1.0.202", features = ["derive"] }
serde_json = "1.0.117"
sha2 = "0.10.8"
stubborn-io = { version = "0.3.5", optional = true }
thiserror = "1.0.61"
tokio = { version = "1.37.0", features = ["full"] }
tokio-tungstenite = { version = "0.23.1", features = ["native-tls"], optional = true }
totp-rs = { version = "5.5.1", optional = true }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
tungstenite = { version = "0.23.0", optional = true }
url = "2.5.0"

[features]
default = ["websocket", "backoff", "dotenv-config", "webdriver-login"]

# Enable WebSocket-based ticker client and its dependencies.
websocket = [
    "dep:tokio-tungstenite",
    "dep:tungstenite",
    "dep:stubborn-io",
]

# Enable WebDriver-based login flow (Chrome automation + TOTP).
webdriver-login = [
    "dep:fantoccini",
    "dep:totp-rs",
    "dep:base32",
]

# Enable backoff-based retry logic for HTTP APIs.
backoff = ["dep:backoff"]

# Enable dotenv-based configuration loading (e.g. in test helpers or examples).
dotenv-config = ["dep:dotenv"]

[dev-dependencies]
log = "0.4.22"
mockito = "1.4.0"
tokio-test = "0.4.2"
futures = "0.3.30"
