[package]
name = "manja"
version = "0.2.0"
edition = "2021"
rust-version = "1.95.0"
authors = ["Paresh Saxena <pareshsaxena@gmail.com>"]
license = "MIT"
description = "Asynchronous client library for Zerodha's Kite Connect trading API"
repository = "https://github.com/saxena-dev/manja"
readme = "README.md"
documentation = "https://docs.rs/manja"
exclude = [
    "Cargo.lock",
    "tests/*",
    "examples/*",
    "benches/*",
    "/*.md",
    ".*",
    ".temp/*",
    "kiteconnect-mocks",
    "*.py"
]

[dependencies]
chrono = { version = "0.4.38", features = ["serde"] }
csv = { version = "1.3.0", optional = true }
futures-util = { version = "0.3.30", optional = true }
hex = { version = "0.4.3", optional = true }
reqwest = { version = "0.12.4", features = ["gzip", "zstd"], optional = true }
secrecy = "0.8.0"
serde = { version = "1.0.202", features = ["derive"] }
serde_json = "1.0.117"
sha2 = { version = "0.10.8", optional = true }
stubborn-io = { version = "0.3.5", optional = true }
thiserror = "1.0.61"
# Only what the slices use: timers, synchronization and `select!` for both,
# plus a runtime handle and TCP for the ticker.
tokio = { version = "1.37.0", features = ["macros", "sync", "time"], optional = true }
tokio-tungstenite = { version = "0.23.1", features = ["native-tls"], optional = true }
tracing = "0.1.40"
tungstenite = { version = "0.23.0", optional = true }

# Feature slices (docs/contract.md §1). The default enables every
# slice: both live transports and the decoder.
[features]
default = ["http", "ticker", "decoder"]
http = ["dep:csv", "dep:hex", "dep:reqwest", "dep:sha2", "dep:tokio"]
ticker = [
    "dep:futures-util",
    "dep:stubborn-io",
    "dep:tokio",
    "tokio/net",
    "tokio/rt",
    "dep:tokio-tungstenite",
    "dep:tungstenite",
]
decoder = []

[dev-dependencies]
# Re-hashes the vendored ticker corpus in tests/fixture_manifest.rs.
sha2 = "0.10.8"
# Paused-clock tests of admission windows and deadlines.
tokio = { version = "1.37.0", features = ["full", "test-util"] }
# Span capture in instrumentation tests; subscribers are the host's concern.
tracing-subscriber = "0.3.18"

# Integration tests that need a live-transport slice declare it, so every
# feature row can run `cargo test` over the targets it supports.
[[test]]
name = "support"
path = "tests/support/main.rs"
required-features = ["http", "ticker"]

[[test]]
name = "http_classification"
required-features = ["http"]

[[test]]
name = "http_admission"
required-features = ["http"]

[[test]]
name = "http_scheduling"
required-features = ["http"]

[[test]]
name = "http_reads"
required-features = ["http"]

[[test]]
name = "http_orders"
required-features = ["http"]

[[test]]
name = "http_margins"
required-features = ["http"]

[[test]]
name = "http_market"
required-features = ["http"]

[[test]]
name = "http_session"
required-features = ["http"]

[[test]]
name = "http_historical"
required-features = ["http"]

[[test]]
name = "http_gtt"
required-features = ["http"]

[[test]]
name = "http_observability"
required-features = ["http"]

[[test]]
name = "ticker_owner"
required-features = ["ticker"]

[[test]]
name = "ticker_subscriptions"
required-features = ["ticker"]

[[test]]
name = "ticker_lifecycle"
required-features = ["ticker"]

[[test]]
name = "ticker_delivery"
required-features = ["ticker"]

[[test]]
name = "ticker_status"
required-features = ["ticker"]

[[test]]
name = "decoder_framing"
required-features = ["decoder"]

[[test]]
name = "decoder_packets"
required-features = ["decoder"]

[[test]]
name = "decoder_text"
required-features = ["decoder"]

[[test]]
name = "decoder_adapter"
required-features = ["decoder"]

[[test]]
name = "decoder_qualification"
path = "tests/decoder/main.rs"
required-features = ["decoder"]

[[test]]
name = "observability_conformance"
path = "tests/observability/main.rs"
required-features = ["http", "ticker", "decoder"]

[[test]]
name = "public_surface"
required-features = ["http", "ticker", "decoder"]

# Examples serve repository fixtures from 127.0.0.1; none contacts a live
# endpoint unless asked with explicit inputs (see examples/session.rs).
[[example]]
name = "http_client"
required-features = ["http"]

[[example]]
name = "session"
required-features = ["http"]

[[example]]
name = "ticker"
required-features = ["ticker"]

[[example]]
name = "ticker_typed"
required-features = ["ticker", "decoder"]

[[example]]
name = "decode_offline"
required-features = ["decoder"]

# Observability overhead measurements (docs/verification.md §5.2); see
# benches/overhead.rs.
[[bench]]
name = "overhead"
harness = false
required-features = ["http", "ticker", "decoder"]
